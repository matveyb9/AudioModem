name: Device compatibility report
description: Share an anonymised result for an audio route and profile.
title: "compat: "
labels: ["device-compatibility", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "Do not attach recordings, user content, callsigns, keys or serial numbers."
  - type: input
    id: app_version
    attributes:
      label: App or CLI version
    validations:
      required: true
  - type: input
    id: route
    attributes:
      label: Sender and receiver route
      placeholder: e.g. Android speaker → Windows microphone
    validations:
      required: true
  - type: input
    id: profile
    attributes:
      label: Preset or profile
      placeholder: e.g. Acoustic-1 / Balanced
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Result and anonymised metrics
    validations:
      required: true
