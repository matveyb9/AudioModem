name: Documentation site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate static documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify required site files and local links
        run: |
          test -s site/index.html
          test -s site/ru/index.html
          test -s site/styles.css
          ! grep -q 'assets/' site/index.html
          grep -q 'docs/guides/getting-started.md' site/index.html
          grep -q 'docs/guides/getting-started_RU.md' site/ru/index.html
          grep -q 'README_RU.md' README.md
          grep -q 'README.md' README_RU.md
      - name: Validate device-acceptance tooling fixtures
        run: |
          node tools/device-acceptance/validate-report.mjs \
            tools/device-acceptance/fixtures/report-template-v1.json
          node tools/device-acceptance/validate-report.mjs \
            tools/device-acceptance/fixtures/android-speaker-microphone-template-v1.json
          node tools/device-acceptance/test-validator.mjs
      - name: Verify English and Russian document pairs
        run: |
          pairs=(
            "docs/README.md:docs/README_RU.md"
            "docs/guides/getting-started.md:docs/guides/getting-started_RU.md"
            "docs/guides/audio-routes.md:docs/guides/audio-routes_RU.md"
            "docs/reference/platform-support.md:docs/reference/platform-support_RU.md"
            "docs/reference/presets.md:docs/reference/presets_RU.md"
            "docs/troubleshooting.md:docs/troubleshooting_RU.md"
            "docs/implementation-plan.md:docs/implementation-plan_RU.md"
            "docs/roadmap.md:docs/roadmap_RU.md"
            "docs/architecture/android-live-audio.md:docs/architecture/android-live-audio_RU.md"
            "docs/research/acoustic-1-phy-sources.md:docs/research/acoustic-1-phy-sources_RU.md"
            "docs/research/acoustic-2-measurement-sources.md:docs/research/acoustic-2-measurement-sources_RU.md"
            "docs/research/device-acceptance-sources.md:docs/research/device-acceptance-sources_RU.md"
            "docs/research/live-audio-adapter-sources.md:docs/research/live-audio-adapter-sources_RU.md"
            "docs/research/android-live-audio-adapter-sources.md:docs/research/android-live-audio-adapter-sources_RU.md"
            "docs/operations/device-acceptance.md:docs/operations/device-acceptance_RU.md"
            "spec/protocol-v1.md:spec/protocol-v1_RU.md"
            "spec/acoustic-1.md:spec/acoustic-1_RU.md"
            "spec/acoustic-2.md:spec/acoustic-2_RU.md"
            "spec/live-audio-adapter-v1.md:spec/live-audio-adapter-v1_RU.md"
            "spec/android-live-audio-adapter-v1.md:spec/android-live-audio-adapter-v1_RU.md"
          )
          for pair in "${pairs[@]}"; do
            source_path="${pair%%:*}"
            translation_path="${pair##*:}"
            test -s "$source_path"
            test -s "$translation_path"
            grep -q 'English (canonical)' "$translation_path"
          done

  publish:
    name: Publish GitHub Pages branch
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Publish only the static site to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/audiomodem-site"
          cp -a site/. "$RUNNER_TEMP/audiomodem-site/"
          git switch --orphan gh-pages
          git reset --hard
          cp -a "$RUNNER_TEMP/audiomodem-site/." .
          touch .nojekyll
          git add --all
          git commit -m "docs: publish GitHub Pages" || exit 0
          git push --force origin HEAD:gh-pages
