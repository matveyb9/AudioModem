[workspace]
members = [
  "crates/adlp-protocol",
  "crates/audio-modem-core",
  "tools/adlp-cli",
  "apps/audio_modem/rust",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matveyb9/AudioModem"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
